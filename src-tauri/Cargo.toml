[package]
name = "leagueaccounts-app"
version = "3.5.0"
edition = "2021"
description = "League of Legends account manager for Windows"
license = "MIT"
publish = false

[[bin]]
name = "LeagueAccounts"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
leagueaccounts = { path = ".." }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
base64 = "0.22"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
