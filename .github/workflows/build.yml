name: Build EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: LeagueAccounts-Portable
          path: src-tauri/target/release/LeagueAccounts.exe