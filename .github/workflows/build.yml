name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App (Release)
        run: npx tauri build

      - name: Upload LeagueAccounts Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeagueAccounts-Portable
          path: src-tauri/target/release/LeagueAccounts.exe